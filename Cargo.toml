[package]
  name    = "system-notification"
  version = "0.1.0"
  edition = "2021"

  # See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
  chrono     = "0.4.44"
  dotenvy    = "0.15.7"
  reqwest    = { version = "0.13.3", default-features = false, features = [
    "json",
    "rustls"
  ] }
  serde_json = "1.0.149"
  sysinfo    = "0.38.4"
  tokio      = { version = "1.52.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
  ] }
